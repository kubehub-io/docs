name: Build and publish Docker image (web)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set image tag
        run: |
          DATE=$(date +%Y%m%d)
          REV=$((GITHUB_RUN_NUMBER))

          echo "DATE=$DATE" >> "$GITHUB_ENV"
          echo "REV=$REV" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=main-$DATE-$REV" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx (multi-platform builder)
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build project
        run: npm run build --if-present

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: InspectImage
        run: docker buildx imagetools inspect ${{ github.repository }}:${{ env.IMAGE_TAG }}          
