baseURL = 'https://docs.kubehub.io/'
locale = 'en-US'
title = 'Kubehub Documentation'

[module]
  [[module.imports]]
    path = "github.com/google/docsy"

[module.hugoVersion]
  min = "0.146.0"

[languages]
  [languages.en]
    label = "English"
    weight = 1
    contentDir = "content/en"

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  offlineSearch = true

[params.ui]
  sidebar_menu_compact = true
  sidebar_menu_foldable = true
  showLightDarkModeMenu = true

[imaging]
  resampleFilter = "Box"
  quality = 68
  anchor = "smart"
